name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
      TYPESTATUS_SIGNING_PASSWORD: ${{ secrets.TYPESTATUS_SIGNING_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset vs2022-x64

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build/vs2022-x64 -C Release --output-on-failure

      - name: Sign executable
        if: ${{ env.SIGNING_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'typestatus-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            ./scripts/sign-release.ps1 `
              -ExecutablePath build/vs2022-x64/Release/TypeStatus.exe `
              -CertificatePath $certificatePath
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Package artifact
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -ExecutablePath build/vs2022-x64/Release/TypeStatus.exe `
            -OutputDirectory dist/package

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: TypeStatus-windows-x64
          path: |
            dist/package/TypeStatus-windows-x64.zip
            dist/package/TypeStatus-windows-x64.zip.sha256
